<div class="newsletter-box" style="background: linear-gradient(135deg, #f3efe7 0%, #e7f0ed 100%); border: 1px solid #cfe1dc; border-radius: 16px; padding: 2rem; margin: 2rem 0; text-align: center;">
    <h3 style="color: #17423b; font-size: 1.3rem; margin-bottom: 0.5rem;">
        <i class="fas fa-envelope-open-text" style="margin-left: 0.5rem;"></i>
        رایگان: خلاصه هفتگی بهترین مقالات زوج‌درمانی
    </h3>
    <p style="color: #5c534c; margin-bottom: 1.5rem; font-size: 0.95rem;">
        هر هفته جدیدترین نکات روانشناسی رابطه، تمرین‌های عملی و داستان‌های واقعی را در ایمیلتان دریافت کنید.
    </p>
    <form id="newsletter-form" style="display: flex; gap: 0.5rem; max-width: 400px; margin: 0 auto; flex-wrap: wrap; justify-content: center;">
        <input type="email" name="email" placeholder="ایمیل شما" required
               style="flex: 1; min-width: 200px; padding: 0.8rem 1rem; border-radius: 50px; border: 1px solid #cfe1dc; font-family: inherit; font-size: 0.95rem; outline: none;">
        <button type="submit" 
                style="background: #17423b; color: white; padding: 0.8rem 1.5rem; border-radius: 50px; border: none; font-family: inherit; font-weight: 700; cursor: pointer; white-space: nowrap;">
            <i class="fas fa-paper-plane" style="margin-left: 0.3rem;"></i> ثبت‌نام
        </button>
    </form>
    <p style="color: #999; font-size: 0.8rem; margin-top: 1rem;">
        <i class="fas fa-lock" style="margin-left: 0.3rem;"></i>
        حریم خصوصی شما محترم است. هر زمان بخواهید لغو اشتراک کنید.
    </p>
    <script>
    (function() {
        var form = document.getElementById('newsletter-form');
        if (!form) return;
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            var email = form.querySelector('input[type="email"]').value;
            if (email) {
                var btn = form.querySelector('button');
                btn.innerHTML = '<i class="fas fa-check"></i> ثبت شد!';
                btn.style.background = '#2d7a5f';
                form.querySelector('input').disabled = true;
                btn.disabled = true;
                setTimeout(function() {
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> ثبت‌نام';
                    btn.style.background = '#17423b';
                    form.querySelector('input').disabled = false;
                    form.querySelector('input').value = '';
                    btn.disabled = false;
                }, 3000);
            }
        });
    })();
    </script>
</div>
